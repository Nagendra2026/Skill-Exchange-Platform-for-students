[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-exchange-platform"
version = "1.0.0"
description = "Skill Exchange Platform for Students"
requires-python = ">=3.11,<3.13"
dependencies = [
    "Flask==2.3.3",
    "Werkzeug==2.3.7",
    "requests==2.31.0",
    "joblib==1.3.2",
    "numpy==1.24.4",
    "gunicorn==21.2.0"
]

[tool.setuptools]
packages = ["."]