<!DOCTYPE html>
<html>
<head>
<title>Edit Skill</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-10 rounded-xl shadow-xl w-96">

<h2 class="text-2xl font-bold mb-6 text-purple-700">Edit Skill</h2>

<form action="/update-skill" method="POST">

<input type="hidden" name="id" value="{{skill.id}}">

<label>Skill Name</label>
<input type="text" name="skill" value="{{skill.skill}}" class="border p-3 w-full mb-4 rounded">

<label>Skill Type</label>
<select name="type" class="border p-3 w-full mb-4 rounded">
<option value="teach">Teach</option>
<option value="learn">Learn</option>
</select>

<button class="bg-purple-700 text-white w-full p-3 rounded">Update Skill</button>

</form>

</div>

</body>
</html>
