<!DOCTYPE html>
<html>
<head>
<title>Feature Importance</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<style>
body{
background: linear-gradient(135deg,#0f0f0f,#1a1a2e,#16213e);
min-height:100vh;
}

/* Glass effect */
.glass{
background: rgba(255,255,255,0.08);
backdrop-filter: blur(20px);
border-radius:20px;
box-shadow:0 8px 32px rgba(0,0,0,0.6);
border:1px solid rgba(255,255,255,0.1);
}

/* Floating animation */
@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-6px);}
100%{transform:translateY(0px);}
}

.float{
animation: float 4s ease-in-out infinite;
}
</style>

<body class="bg-gray-100">

<div class="bg-purple-700 text-white p-5 flex justify-between">
<h1 class="text-2xl font-bold">AI Feature Importance 📊</h1>
<a href="/dashboard" class="bg-white text-purple-700 px-4 py-2 rounded">Dashboard</a>
</div>

<div class="p-10">

<table class="w-full bg-white shadow-lg rounded-xl overflow-hidden">

<tr class="bg-purple-700 text-white">
<th class="p-3">Feature</th>
<th>Importance Score</th>
</tr>

{% for row in data %}
<tr class="text-center border-b">
<td class="p-3 font-semibold">{{row.feature}}</td>
<td class="text-purple-700 font-bold">{{ "%.4f"|format(row.importance) }}</td>
</tr>
{% endfor %}

</table>

</div>

</body>
</html>
