<!DOCTYPE html>
<html>
<head>
<title>Practice Lab</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<style>
body{
background: linear-gradient(135deg,#0f0f0f,#1a1a2e,#16213e);
min-height:100vh;
}

/* Glass effect */
.glass{
background: rgba(255,255,255,0.08);
backdrop-filter: blur(20px);
border-radius:20px;
box-shadow:0 8px 32px rgba(0,0,0,0.6);
border:1px solid rgba(255,255,255,0.1);
}

/* Floating animation */
@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-6px);}
100%{transform:translateY(0px);}
}

.float{
animation: float 4s ease-in-out infinite;
}
</style>

<body class="bg-gray-100">

<!-- Navbar -->
<div class="bg-black text-white p-5 flex justify-between">
<h1 class="text-2xl font-bold">Practice Coding Lab 💻</h1>

<a href="/dashboard">
<button class="bg-white text-black px-4 py-2 rounded">Dashboard</button>
</a>
</div>

<!-- Tabs -->
<div class="p-6 text-center">

<button onclick="showTab('python')" class="bg-blue-600 text-white px-4 py-2 m-2 rounded">Python</button>
<button onclick="showTab('java')" class="bg-red-600 text-white px-4 py-2 m-2 rounded">Java</button>
<button onclick="showTab('sql')" class="bg-green-600 text-white px-4 py-2 m-2 rounded">SQL</button>
<button onclick="showTab('html')" class="bg-purple-600 text-white px-4 py-2 m-2 rounded">HTML/CSS</button>

</div>

<!-- Editors -->
<div class="p-10">

<!-- Python -->
<div id="python" class="tab">
<iframe src="https://www.programiz.com/python-programming/online-compiler" 
width="100%" height="600"></iframe>
</div>

<!-- Java -->
<div id="java" class="tab hidden">
<iframe src="https://www.programiz.com/java-programming/online-compiler" 
width="100%" height="600"></iframe>
</div>

<!-- SQL -->
<div id="sql" class="tab hidden">
<iframe src="https://www.programiz.com/sql/online-compiler" 
width="100%" height="600"></iframe>
</div>

<!-- HTML -->
<div id="html" class="tab hidden">
<iframe src="https://www.programiz.com/html/online-compiler" 
width="100%" height="600"></iframe>
</div>

</div>

<script>
function showTab(tab){
document.querySelectorAll(".tab").forEach(t=>t.classList.add("hidden"))
document.getElementById(tab).classList.remove("hidden")
}
</script>

</body>
</html>
