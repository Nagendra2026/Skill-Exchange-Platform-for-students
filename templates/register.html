<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<style>
body{
background: linear-gradient(135deg,#0f0f0f,#1a1a2e,#16213e);
min-height:100vh;
}

/* Glass effect */
.glass{
background: rgba(255,255,255,0.08);
backdrop-filter: blur(20px);
border-radius:20px;
box-shadow:0 8px 32px rgba(0,0,0,0.6);
border:1px solid rgba(255,255,255,0.1);
}

/* Floating animation */
@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-6px);}
100%{transform:translateY(0px);}
}

.float{
animation: float 4s ease-in-out infinite;
}
</style>

<body class="bg-gradient-to-r from-indigo-600 to-purple-700 h-screen flex items-center justify-center">

<div class="bg-white p-10 rounded-2xl shadow-2xl w-[420px]">

<h2 class="text-3xl font-bold text-center mb-6 text-purple-700">Create Account</h2>

<form action="/register-user" method="POST">

<label class="font-semibold">Full Name</label>
<input name="name" class="border p-3 w-full mb-3 rounded" required>

<label class="font-semibold">Email</label>
<input name="email" class="border p-3 w-full mb-3 rounded" required>

<label class="font-semibold">Password</label>
<input type="password" name="password" class="border p-3 w-full mb-3 rounded" required>

<label class="font-semibold">Confirm Password</label>
<input type="password" name="confirm" class="border p-3 w-full mb-3 rounded" required>

<label class="font-semibold">Role</label>
<select name="role" class="border p-3 w-full mb-3 rounded">
<option value="student">Student</option>
<option value="faculty">Faculty</option>
</select>

<label class="font-semibold">Department</label>
<input name="dept" placeholder="CSE, ECE, IT..." class="border p-3 w-full mb-4 rounded">

<button class="bg-purple-700 text-white w-full p-3 rounded font-bold hover:bg-purple-900">
Register
</button>

</form>

<p class="text-center mt-4">
Already have account?
<a href="/login" class="text-purple-700 font-bold">Login</a>
</p>

</div>

</body>
</html>
