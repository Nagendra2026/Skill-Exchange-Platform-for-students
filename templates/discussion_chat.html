<!DOCTYPE html>
<html>
<head>
<title>Discussion Chat</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<style>
body{
background: linear-gradient(135deg,#0f0f0f,#1a1a2e,#16213e);
min-height:100vh;
}

/* Glass effect */
.glass{
background: rgba(255,255,255,0.08);
backdrop-filter: blur(20px);
border-radius:20px;
box-shadow:0 8px 32px rgba(0,0,0,0.6);
border:1px solid rgba(255,255,255,0.1);
}

/* Floating animation */
@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-6px);}
100%{transform:translateY(0px);}
}

.float{
animation: float 4s ease-in-out infinite;
}
</style>

<body class="bg-gray-100">

<!-- Top bar -->
<div class="bg-purple-700 text-white p-5 flex justify-between">
<h1 class="text-xl font-bold">Discussion Chat</h1>

<a href="/discussions">
<button class="bg-white text-purple-700 px-4 py-2 rounded">Back</button>
</a>
</div>

<!-- Chat messages -->
<div class="p-6 h-[70vh] overflow-auto bg-white chat-area">

{% for m in messages %}
<div class="mb-4 p-3 bg-gray-100 rounded">
<b>{{m.name}}</b><br>

{% if m.message %}
<span>{{m.message}}</span><br>
{% endif %}

{% if m.file %}
<a href="/uploads/{{m.file}}" target="_blank">
<button class="mt-2 bg-blue-600 text-white px-3 py-1 rounded">
📎 View File
</button>
</a>
{% endif %}

<small class="text-gray-500">{{m.created_at}}</small>
</div>
{% endfor %}

</div>

<!-- Message input -->
<div class="p-6 bg-gray-200">

<input id="msg" placeholder="Share notes, links, doubts..."
class="border p-3 w-full rounded mb-3">

<input type="file" id="fileInput"
class="border p-2 w-full rounded mb-3 bg-white">

<button onclick="sendMsg()" 
class="bg-purple-700 text-white px-6 py-3 rounded w-full hover:bg-purple-900">
Send
</button>

</div>

<!-- SCRIPT -->
<script>

const discussionId = "{{ did }}";

// SEND MESSAGE (TEXT + FILE)
function sendMsg(){

let msg = document.getElementById("msg").value;
let file = document.getElementById("fileInput").files[0];

if(msg.trim()=="" && !file){
alert("Enter message or attach file");
return;
}

let formData = new FormData();
formData.append("discussion_id", discussionId);
formData.append("message", msg);

if(file){
formData.append("file", file);
}

fetch("/post-message",{
method:"POST",
body:formData
})
.then(res=>res.json())
.then(()=>{
document.getElementById("msg").value="";
document.getElementById("fileInput").value="";
loadMessages();
});
}


// LOAD LIVE MESSAGES
function loadMessages(){

fetch("/get-messages/"+discussionId)
.then(res=>res.json())
.then(data=>{

let chatBox = "";

data.forEach(m=>{

chatBox += `
<div class="mb-4 p-3 bg-gray-100 rounded">
<b>${m.name}</b><br>

${m.message ? `<span>${m.message}</span><br>` : ""}

${m.file ? `<a href="/uploads/${m.file}" target="_blank">
<button class="mt-2 bg-blue-600 text-white px-3 py-1 rounded">
📎 View File
</button></a>` : ""}

<small class="text-gray-500">${m.created_at}</small>
</div>
`;

});

document.querySelector(".chat-area").innerHTML = chatBox;

});
}


// AUTO REFRESH EVERY 2 SEC
setInterval(loadMessages,2000);

// FIRST LOAD
loadMessages();

</script>

</body>
</html>
