<!DOCTYPE html>
<html>
<head>
<title>Discussion Board</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<style>
body{
background: linear-gradient(135deg,#0f0f0f,#1a1a2e,#16213e);
min-height:100vh;
}

/* Glass effect */
.glass{
background: rgba(255,255,255,0.08);
backdrop-filter: blur(20px);
border-radius:20px;
box-shadow:0 8px 32px rgba(0,0,0,0.6);
border:1px solid rgba(255,255,255,0.1);
}

/* Floating animation */
@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-6px);}
100%{transform:translateY(0px);}
}

.float{
animation: float 4s ease-in-out infinite;
}
</style>

<body class="bg-gray-100">

<div class="bg-purple-700 text-white p-5">
<h1 class="text-2xl font-bold">Discussion Board 💬</h1>
</div>

<div class="p-10">

{% for t in topics %}
<div class="bg-white p-6 mb-4 rounded shadow flex justify-between">
<h2 class="font-bold">{{t.title}}</h2>

<a href="/discussion/{{t.id}}">
<button class="bg-purple-700 text-white px-4 py-2 rounded">Open</button>
</a>
</div>
{% endfor %}

</div>

</body>
</html>
